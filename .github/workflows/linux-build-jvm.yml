name: Linux build (JVM)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  jars:
    uses: ./.github/workflows/_build-jars.yml

  linux:
    needs: jars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (for jlink)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Stage the embedded JRE (jlink) + JNI headers
        run: |
          set -euo pipefail
          "$JAVA_HOME/bin/jlink" \
            --module-path "$JAVA_HOME/jmods" --add-modules ALL-MODULE-PATH \
            --strip-debug --no-header-files --no-man-pages --output linux/jre
          cp -r "$JAVA_HOME/include" linux/jre/include
          mkdir -p linux/jars

      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          name: jvm-jars
          path: linux/jars

      - name: Install Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Linux app
        run: |
          set -euo pipefail
          flutter config --enable-linux-desktop
          flutter pub get
          flutter build linux --release
          echo "== bundle ==" && ls -la build/linux/x64/release/bundle

      - name: Tar bundle
        run: |
          cd build/linux/x64/release/bundle
          tar czf "$GITHUB_WORKSPACE/Foxlations-linux-x64.tar.gz" .
          echo "tar: $(ls -lh "$GITHUB_WORKSPACE/Foxlations-linux-x64.tar.gz")"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Foxlations-linux-x64
          path: Foxlations-linux-x64.tar.gz
          if-no-files-found: error
