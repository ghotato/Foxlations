name: Android build (Mihon-style)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vendor the eu.kanade.tachiyomi.* extension runtime (ApkBridge, Apache-2.0)
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Schnitzel5/ApkBridge "$RUNNER_TEMP/apkbridge"
          SRC="$RUNNER_TEMP/apkbridge/app/src/main/java"
          DEST="android/app/src/main/ext-runtime"
          rm -rf "$DEST" && mkdir -p "$DEST"
          # Copy ONLY the extension-API runtime packages — NOT ApkBridge's own app code
          # (me/schnitzel, the NanoHTTPD server, DalvikHandler); we drive it over a
          # MethodChannel instead. Our own ChildFirstPathClassLoader/ExtensionHost live in
          # src/main/kotlin and take precedence.
          for pkg in eu tachiyomi keiyoushi; do
            if [ -d "$SRC/$pkg" ]; then cp -r "$SRC/$pkg" "$DEST/"; fi
          done
          # Drop Mihon UI-only code — the headless source runtime (HttpSource/NetworkHelper/
          # models) doesn't need the Jetpack Compose preference-state helpers.
          rm -rf "$DEST/eu/kanade/core" "$DEST/eu/kanade/presentation" 2>/dev/null || true
          grep -rlE 'androidx\.compose|PreferenceMutableState' "$DEST" 2>/dev/null | xargs -r rm -f || true
          echo "vendored:" && find "$DEST" -name '*.kt' | wc -l && find "$DEST" -name '*.java' | wc -l
          # Add compat stubs for keiyoushi classes newer than the vendored runtime (RateLimited).
          # (compat/*.kt is non-recursive, so the compat/android/ subdir below is not swept in.)
          if ! find "$DEST" -name 'RateLimited.kt' | grep -q .; then
            mkdir -p "$DEST/eu/kanade/tachiyomi/source"
            cp docs/kotlin-extensions/m1/compat/*.kt "$DEST/eu/kanade/tachiyomi/source/"
          fi
          # Override ApkBridge's SManga/SChapter models with our API-1.6 versions — they add
          # the `memo: JsonObject?` field keiyoushi sources call get/setMemo on (ApkBridge omits
          # it → NoSuchMethodError: setMemo). Kept in a subdir so the JVM-host build, which uses
          # Suwayomi's own model, never picks these up.
          mkdir -p "$DEST/eu/kanade/tachiyomi/source/model"
          cp docs/kotlin-extensions/m1/compat/android/*.kt "$DEST/eu/kanade/tachiyomi/source/model/"
          # Sanity: the runtime must not reference ApkBridge's app package.
          if grep -rl 'me\.schnitzel' "$DEST" >/dev/null 2>&1; then
            echo "::warning::vendored runtime references me.schnitzel — trimming those files"
            grep -rl 'me\.schnitzel' "$DEST" | xargs rm -f || true
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Consistent RELEASE signing so users get in-place updates instead of having to
      # uninstall/reinstall. Android only lets an installed app update if every build is
      # signed with the SAME key. Without the secret we fall back to the ephemeral debug
      # key (a fresh one per runner → forces reinstall each time). build.gradle.kts picks
      # up android/key.properties automatically when present.
      - name: Set up release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set — building with the"
            echo "::warning::ephemeral debug key. Installs will NOT update in place."
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=${STORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > android/key.properties
          echo "Release signing configured."

      - name: Build APK (arm64)
        run: |
          set -euo pipefail
          flutter pub get
          flutter build apk --release --target-platform android-arm64
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Foxlations-android-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
