name: iOS build → server

# Builds an UNSIGNED iOS .ipa on a macOS runner and delivers it to your server
# over Tailscale (scp) into builds/build-NNN/ — no GitHub Release, nothing stored
# on GitHub. Triggered by the local orchestrator (scripts/release.sh) via:
#   gh workflow run ios-build.yml -f build_number=<N> -f version=<A.B.C+N>
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number N (target folder builds/build-NNN)'
        required: true
      version:
        description: 'Version string, e.g. 0.0.26+20'
        required: true

# Pin to your local Flutter. If the runner can't fetch this exact version,
# change it to the nearest public stable (Dart constraint is ^3.11.3).
env:
  FLUTTER_VERSION: '3.44.6'

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # rhttp (Rust) is compiled from source for the iOS target.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Build unsigned iOS app
        run: |
          # Use CocoaPods (mature) instead of the experimental Swift Package
          # Manager integration, which fails on this project's first iOS build.
          flutter config --no-enable-swift-package-manager
          flutter pub get
          flutter build ios --release --no-codesign

      - name: Package ad-hoc signed IPA
        id: pkg
        run: |
          set -euo pipefail
          NNN=$(printf '%03d' "${{ inputs.build_number }}")
          echo "nnn=$NNN" >> "$GITHUB_OUTPUT"
          cd build/ios/iphoneos
          APP=Runner.app

          # `codesign --deep` seals the outer bundle but leaves the nested
          # framework binaries with NO LC_CODE_SIGNATURE (verified: 42 of 44
          # frameworks came out unsigned). A sideloader then has to create a
          # signature slot from scratch in each one, which is what makes
          # AltStore/AltSign's ldid assert:
          #   ldid.cpp(1461): _assert(): end >= size - 0x10
          # So sign inside-out and explicitly, never via --deep.

          # Some pods ship a single-slice "fat" wrapper (objective_c does).
          # Flatten to a plain arm64 Mach-O so re-signers don't have to rewrite
          # fat offsets — a device build only ever needs the arm64 slice.
          for fw in "$APP"/Frameworks/*.framework; do
            bin="$fw/$(basename "$fw" .framework)"
            [ -f "$bin" ] || continue
            if [ "$(od -An -N4 -tx1 "$bin" | tr -d ' \n')" = "cafebabe" ]; then
              echo "thinning fat binary: $bin"
              lipo -thin arm64 "$bin" -output "$bin.thin"
              mv "$bin.thin" "$bin"
            fi
          done

          # Frameworks first, then the app bundle last so its CodeResources
          # seals the signatures we just created.
          for fw in "$APP"/Frameworks/*.framework; do
            codesign --force --sign - --timestamp=none "$fw"
          done
          codesign --force --sign - --timestamp=none "$APP"

          # Fail loudly rather than shipping a half-signed bundle again.
          fail=0
          for fw in "$APP"/Frameworks/*.framework; do
            codesign -dv "$fw" >/dev/null 2>&1 || { echo "::error::still unsigned: $fw"; fail=1; }
          done
          [ "$fail" = 0 ]
          codesign -dv "$APP"

          mkdir -p Payload
          cp -R "$APP" Payload/
          IPA="foxlations-${{ inputs.version }}.ipa"
          zip -qq -r "$IPA" Payload
          echo "ipa=$PWD/$IPA" >> "$GITHUB_OUTPUT"

      # Join your tailnet (ephemeral node, auto-removed after the run).
      - name: Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE }}
          # If you switch to an OAuth client instead of an auth key, replace the
          # line above with:
          #   oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          #   oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          #   tags: tag:ci

      - name: Deliver IPA to server
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.SERVER_USER }}
          BUILDS_PATH: ${{ secrets.SERVER_BUILDS_PATH }}
        run: |
          mkdir -p ~/.ssh
          # Accept the key either as raw PEM text or base64 (base64 survives
          # copy/paste into the secret without newline mangling).
          if printf '%s' "$SSH_KEY" | grep -q 'BEGIN .*PRIVATE KEY'; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ci
          else
            printf '%s' "$SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/id_ci
          fi
          chmod 600 ~/.ssh/id_ci
          # Fail loudly with a useful message instead of falling back to passwords.
          if ! ssh-keygen -y -f ~/.ssh/id_ci > /dev/null 2>&1; then
            echo "::error::SERVER_SSH_KEY is not a valid OpenSSH PRIVATE key. Paste the contents of 'foxlations_ci' (not foxlations_ci.pub), or base64 it: base64 -w0 foxlations_ci"
            exit 1
          fi
          SSH_OPTS="-i $HOME/.ssh/id_ci -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new"
          DEST="${BUILDS_PATH%/}/build-${{ steps.pkg.outputs.nnn }}"
          ssh $SSH_OPTS "${USER_NAME}@${HOST}" "mkdir -p '${DEST}'"
          scp $SSH_OPTS "${{ steps.pkg.outputs.ipa }}" "${USER_NAME}@${HOST}:${DEST}/"
          echo "Delivered IPA to ${USER_NAME}@${HOST}:${DEST}/"
