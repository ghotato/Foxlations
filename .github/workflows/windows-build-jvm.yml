name: Windows build (JVM)

on:
  workflow_dispatch:
    inputs:
      deliver:
        description: 'Also scp the zip home over Tailscale? (true/false)'
        required: false
        default: 'false'
  push:
    tags: ['v*']

jobs:
  # Build the platform-independent extension-host jars once (on Linux).
  jars:
    uses: ./.github/workflows/_build-jars.yml

  windows:
    needs: jars
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Same build-number derivation as the iOS workflow, so the zip lands in the
      # SAME builds/build-NNN/ folder as the APK + IPA (pubspec's +N is the key).
      - name: Resolve version and build number
        id: meta
        shell: bash
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/^version: *//' | tr -d '[:space:]')
          N="${V##*+}"
          echo "version=$V"                >> "$GITHUB_OUTPUT"
          echo "nnn=$(printf '%03d' "$N")" >> "$GITHUB_OUTPUT"
          echo "Building $V (Windows) as build $N"

      - name: Set up JDK 21 (for jlink)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Stage the embedded JRE (jlink) + jars
        shell: bash
        run: |
          set -euo pipefail
          # Full runtime image so every module Suwayomi touches (java.sql/naming/desktop,
          # jdk.crypto.ec, …) is present. Windows runtime because jlink runs on this JDK.
          "$JAVA_HOME/bin/jlink" \
            --module-path "$JAVA_HOME/jmods" --add-modules ALL-MODULE-PATH \
            --strip-debug --no-header-files --no-man-pages --output windows/jre
          # JNI headers for compiling native/jvm_bridge.cpp.
          cp -r "$JAVA_HOME/include" windows/jre/include
          mkdir -p windows/jars

      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          name: jvm-jars
          path: windows/jars

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Windows app
        shell: bash
        run: |
          set -euo pipefail
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release
          echo "== bundle ==" && ls -la build/windows/x64/runner/Release

      - name: Zip bundle
        shell: bash
        run: |
          cd build/windows/x64/runner/Release
          7z a "$GITHUB_WORKSPACE/Foxlations-windows-x64.zip" . >/dev/null
          echo "zip: $(ls -lh "$GITHUB_WORKSPACE/Foxlations-windows-x64.zip")"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Foxlations-windows-x64
          path: Foxlations-windows-x64.zip
          if-no-files-found: error

      # Deliver the zip straight into builds/build-NNN/ on the server (over
      # Tailscale), the SAME way the iOS runner delivers the IPA — so a release
      # run gathers all three artifacts in one folder with no manual download.
      # Gated on the deliver input (set by scripts/release.sh's dispatch); a bare
      # tag push builds + uploads the artifact but does not ship it home.
      - name: Tailscale
        if: inputs.deliver == 'true'
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE }}

      - name: Deliver Windows zip to server
        if: inputs.deliver == 'true'
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.SERVER_USER }}
          BUILDS_PATH: ${{ secrets.SERVER_BUILDS_PATH }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          if printf '%s' "$SSH_KEY" | grep -q 'BEGIN .*PRIVATE KEY'; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ci
          else
            printf '%s' "$SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/id_ci
          fi
          chmod 600 ~/.ssh/id_ci
          SSH_OPTS="-i $HOME/.ssh/id_ci -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=10"
          DEST="${BUILDS_PATH%/}/build-${{ steps.meta.outputs.nnn }}"
          # Versioned name so it matches the *-windows-x64.zip glob the publish
          # scripts look for, alongside the APK/IPA for the same build.
          ZIP_NAME="foxlations-${{ steps.meta.outputs.version }}-windows-x64.zip"
          ssh $SSH_OPTS "${USER_NAME}@${HOST}" "mkdir -p '${DEST}'"
          scp $SSH_OPTS "$GITHUB_WORKSPACE/Foxlations-windows-x64.zip" \
              "${USER_NAME}@${HOST}:${DEST}/${ZIP_NAME}"
          echo "Delivered to ${USER_NAME}@${HOST}:${DEST}/${ZIP_NAME}"
