# Container raised to a 10 GB cgroup, so heaps can be generous. The Dart AOT
# compiler (gen_snapshot, a separate process) still needs ~2-3 GB, and Gradle
# R8/dexing of the plugin set wants headroom — sized to stay well under 10 GB.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m
org.gradle.daemon=false
org.gradle.workers.max=2
org.gradle.parallel=false
kotlin.daemon.jvmargs=-Xmx1536m
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
