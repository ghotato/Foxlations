name: manga_reader
description: A manga reading app with extension-based sources.
publish_to: 'none'
version: 0.2.17+41

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Network
  dio: ^5.4.0
  rhttp: ^0.15.1
  http: ^1.2.0

  # Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # Holds the AES key for the encrypted Hive boxes in the platform keystore
  # (iOS Keychain / Android EncryptedSharedPreferences), so OAuth tokens are
  # not readable from the app's data directory.
  flutter_secure_storage: ^9.2.2

  # State
  provider: ^6.1.2

  # Extension runtime
  d4rt: ^0.2.2
  flutter_js: ^0.8.7

  # Crypto / unpacker (CryptoJS-compatible AES + P.A.C.K.E.R. deobfuscation
  # used by JS source extensions — cryptoHandler/decryptAESCryptoJS/unpackJs/...)
  crypto: ^3.0.7
  encrypt: ^5.0.3
  js_packer: ^0.0.6

  # PDF export (chapter images -> PDF) + PDF import (rasterize pages to images
  # via the platform renderer). `image` normalizes formats for embedding.
  pdf: ^3.11.0
  printing: ^5.13.0
  image: ^4.8.0

  # HTML parsing
  html: ^0.15.4
  xpath_selector_html_parser: ^3.0.1

  # WebView (with native cookie extraction for Cloudflare bypass)
  flutter_inappwebview: ^6.0.0
  webview_windows: ^0.4.0

  # UI
  sizer: ^2.0.15
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  photo_view: ^0.15.0

  # Video playback
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4

  # Utils
  intl: ^0.19.0
  path_provider: ^2.1.2
  package_info_plus: ^8.0.0
  scrollable_positioned_list: ^0.3.8
  file_picker: ^11.0.2
  archive: ^4.0.9
  google_generative_ai: ^0.4.7
  google_mlkit_text_recognition: ^0.14.0
  google_mlkit_translation: ^0.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/foxlations.png"
  # iOS needs a 1024px OPAQUE icon — the 256px source has an alpha channel,
  # which iOS renders as a black background. Use the full-size art and flatten
  # it onto white so the sideloaded app shows the fox, not Flutter's default.
  image_path_ios: "assets/images/foxlations_1024.png"
  remove_alpha_ios: true
  background_color_ios: "#ffffff"
  windows:
    generate: true
    image_path: "assets/images/foxlations.png"
    icon_size: 48

dependency_overrides:
  flutter_rust_bridge: 2.11.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
