name: manga_reader
description: A manga reading app with extension-based sources.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Network
  dio: ^5.4.0
  rhttp: ^0.15.1
  http: ^1.2.0

  # Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # State
  provider: ^6.1.2

  # Extension runtime
  d4rt: ^0.2.2
  flutter_js: ^0.8.7

  # HTML parsing
  html: ^0.15.4
  xpath_selector_html_parser: ^3.0.1

  # WebView (with native cookie extraction for Cloudflare bypass)
  flutter_inappwebview: ^6.0.0
  webview_windows: ^0.4.0

  # UI
  sizer: ^2.0.15
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  photo_view: ^0.15.0

  # Utils
  intl: ^0.19.0
  path_provider: ^2.1.2
  package_info_plus: ^8.0.0
  scrollable_positioned_list: ^0.3.8
  file_picker: ^11.0.2
  archive: ^4.0.9
  google_generative_ai: ^0.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8

dependency_overrides:
  flutter_rust_bridge: 2.11.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
